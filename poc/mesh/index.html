<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>perch · malha</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 12px/1.4 system-ui, sans-serif; }
  body.bg-wall    { background: linear-gradient(135deg, #1d4e89 0%, #3a7ca5 35%, #d9a441 72%, #c1440e 100%); }
  body.bg-dark    { background: radial-gradient(circle at 30% 20%, #2b3550, #0e1220 70%); }
  body.bg-light   { background: linear-gradient(160deg, #eef2f7, #c9d3e0); }
  body.bg-checker { background: #fff repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 24px 24px; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #under, #over { pointer-events: none; }
  body.dropping::after {
    content: "Solte a imagem"; position: fixed; inset: 12px; border: 3px dashed #fff8;
    border-radius: 16px; display: grid; place-items: center; color: #fff; font-size: 28px;
    background: #0006; pointer-events: none;
  }

  #panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 300px; overflow-y: auto;
    padding: 12px 14px 16px; color: #e8eaf0; background: rgba(16, 18, 26, .9);
    backdrop-filter: blur(8px); transition: transform .2s; scrollbar-width: thin;
  }
  #panel.hidden { transform: translateX(100%); }
  #panel header { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  #panel header span { flex: 1; }
  #show { position: fixed; top: 10px; right: 10px; display: none; }
  #panel.hidden ~ #show { display: block; }
  .hint { color: #a3a8b8; margin: 6px 0 10px; }
  h3 { margin: 14px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #8fa8ff; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; margin: 3px 0; }
  .row output { color: #cfd3df; font-variant-numeric: tabular-nums; }
  .row input { grid-column: 1 / -1; width: 100%; margin: 1px 0 3px; accent-color: #6f8dff; }
  .buttons { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  button, .btn, select {
    font: inherit; color: #e8eaf0; background: #2a2f40; border: 1px solid #3c4359;
    border-radius: 6px; padding: 5px 9px; cursor: pointer;
  }
  button:hover, .btn:hover { background: #343a50; }
  .seg { display: flex; margin: 8px 0; }
  .seg button { flex: 1; border-radius: 0; }
  .seg button:first-child { border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
  .seg button.on { background: #4b63c9; border-color: #6f8dff; }
  .checks { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 6px 0; }
  .checks label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #stats { margin-top: 10px; color: #a3a8b8; font-variant-numeric: tabular-nums; white-space: pre-line; }
  .fatal { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; font-size: 18px; }
</style>
</head>
<body class="bg-wall">
<canvas id="under"></canvas>
<canvas id="gl"></canvas>
<canvas id="over"></canvas>

<aside id="panel">
  <header><span><strong>perch</strong> · deformação de malha</span><button id="hide" title="Esconder (H)">→</button></header>
  <p class="hint">Arraste o pet. Clique rápido = pulo. Solte uma PNG transparente em qualquer lugar (ou Ctrl+V).<br>
    Atalhos: Espaço pula · M malha/rígido · W grade · P pausa · H painel</p>
  <div class="buttons">
    <label class="btn">Carregar imagem<input type="file" id="file" accept="image/*" hidden></label>
    <button id="bird">Pássaro padrão</button>
  </div>
  <div class="seg" id="mode">
    <button data-v="mesh">Malha</button><button data-v="rigid">Rígido (CSS de hoje)</button>
  </div>
  <div class="checks">
    <label><input type="checkbox" id="wire"> Grade</label>
    <label><input type="checkbox" id="marks"> Pivô e âncora</label>
    <label><input type="checkbox" id="pause"> Pausar</label>
  </div>
  <label>Fundo
    <select id="bg">
      <option value="bg-wall">Papel de parede</option>
      <option value="bg-dark">Escuro</option>
      <option value="bg-light">Claro</option>
      <option value="bg-checker">Xadrez (transparência)</option>
    </select>
  </label>
  <div class="buttons">
    <button id="hop">Pular</button><button id="drop">Soltar do alto</button><button id="throw">Arremessar</button>
  </div>
  <div id="controls"></div>
  <div class="buttons">
    <button id="reset">Restaurar padrões</button><button id="copy">Copiar parâmetros</button>
  </div>
  <div id="stats"></div>
</aside>
<button id="show" title="Mostrar painel (H)">☰</button>

<script>
"use strict";

/* PoC da Fase 2: uma imagem qualquer fica convincente animada só pelo sistema?
   A imagem vira uma grade de vértices; cada frame recalcula a posição deles
   (respiração, balanço, gelatina, squash) e o WebGL desenha os triângulos
   texturizados. O modo "rígido" usa exatamente a mesma física, mas a reduz a
   uma transform afim (escala + rotação), que é o que o CSS do overlay faz hoje. */

const STORE_KEY = "perch-poc-mesh-v1";
const TAU = Math.PI * 2;
const ALPHA_MIN = 24;     // 0-255: abaixo disso o pixel é fundo (bbox, pés, hit-test)
const MAX_TEX = 1024;     // imagens maiores são reduzidas antes de virar textura
const STEP = 1 / 120;     // passo fixo da física
const JELLY_K = 0.3;      // escala interna da força de inércia sobre os vértices
const SQUASH_K = 0.004;   // velocidade de impacto (px/s) -> impulso do squash
const HOP_V = 1100;       // px/s
const WALL_BOUNCE = 0.5;
const FLOOR_MARGIN = 28;

const PARAMS = [
  { group: "Malha" },
  { id: "grid", label: "Resolução da grade", min: 1, max: 48, step: 1, value: 16, rebuild: true },
  { id: "scale", label: "Altura do pet (px)", min: 64, max: 480, step: 1, value: 220, rebuild: true },
  { group: "Respiração" },
  { id: "breathAmp", label: "Amplitude", min: 0, max: 0.12, step: 0.005, value: 0.03 },
  { id: "breathHz", label: "Ritmo (Hz)", min: 0.05, max: 1.5, step: 0.05, value: 0.3 },
  { group: "Balanço" },
  { id: "swayAmp", label: "Amplitude", min: 0, max: 0.2, step: 0.005, value: 0.035 },
  { id: "swayHz", label: "Ritmo (Hz)", min: 0.05, max: 2, step: 0.05, value: 0.4 },
  { id: "swayWave", label: "Onda (atraso base → topo)", min: 0, max: 3, step: 0.1, value: 1.2 },
  { group: "Gelatina (inércia)" },
  { id: "jellyGain", label: "Intensidade", min: 0, max: 3, step: 0.05, value: 1 },
  { id: "jellyHz", label: "Frequência (Hz)", min: 0.5, max: 10, step: 0.1, value: 3.2 },
  { id: "jellyDamp", label: "Amortecimento", min: 0.02, max: 1, step: 0.01, value: 0.16 },
  { id: "jellyFalloff", label: "Curva (rígido perto da âncora)", min: 0.5, max: 3, step: 0.1, value: 1.5 },
  { id: "jellySpread", label: "Ondas (pontas mais moles)", min: 0, max: 0.8, step: 0.05, value: 0.45 },
  { id: "hangWeight", label: "Peso ao ficar pendurado", min: 0, max: 3, step: 0.05, value: 1 },
  { group: "Squash & stretch" },
  { id: "squashGain", label: "Intensidade", min: 0, max: 2, step: 0.05, value: 1 },
  { id: "squashHz", label: "Frequência (Hz)", min: 1, max: 12, step: 0.1, value: 5 },
  { id: "squashDamp", label: "Amortecimento", min: 0.05, max: 1, step: 0.01, value: 0.22 },
  { id: "stretchGain", label: "Esticar no ar", min: 0, max: 2, step: 0.05, value: 1 },
  { id: "volume", label: "Preservar volume", min: 0, max: 1, step: 0.05, value: 0.8 },
  { group: "Mundo" },
  { id: "gravity", label: "Gravidade (px/s²)", min: 0, max: 6000, step: 50, value: 3000 },
  { id: "bounce", label: "Quique no chão", min: 0, max: 0.8, step: 0.02, value: 0.2 },
];

const DEFAULTS = {};
for (const p of PARAMS) if (p.id) DEFAULTS[p.id] = p.value;
const UI_DEFAULTS = { mode: "mesh", wire: false, marks: false, bg: "bg-wall", panel: true };
const P = { ...DEFAULTS };
const UI = { ...UI_DEFAULTS };

try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
  for (const k in DEFAULTS) if (typeof saved.p?.[k] === "number") P[k] = saved.p[k];
  for (const k in UI_DEFAULTS) if (typeof saved.ui?.[k] === typeof UI_DEFAULTS[k]) UI[k] = saved.ui[k];
} catch {}

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ p: P, ui: UI })); } catch {}
}

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------------------
// WebGL
// ---------------------------------------------------------------------------

const glCanvas = $("gl");
const under = $("under").getContext("2d");
const over = $("over").getContext("2d");
const gl = glCanvas.getContext("webgl2", { premultipliedAlpha: true, antialias: true });
if (!gl) {
  document.body.insertAdjacentHTML("beforeend", "<p class='fatal'>WebGL2 indisponível neste navegador.</p>");
  throw new Error("sem WebGL2");
}

function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, `#version 300 es
  in vec2 a_pos; in vec2 a_uv; uniform vec2 u_res; out vec2 v_uv;
  void main() {
    vec2 c = a_pos / u_res * 2.0 - 1.0;
    gl_Position = vec4(c.x, -c.y, 0.0, 1.0);
    v_uv = a_uv;
  }`));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, `#version 300 es
  precision mediump float;
  in vec2 v_uv; uniform sampler2D u_tex; out vec4 o;
  void main() { o = texture(u_tex, v_uv); }`));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const uRes = gl.getUniformLocation(prog, "u_res");

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);
const posBuf = gl.createBuffer();
const uvBuf = gl.createBuffer();
const idxBuf = gl.createBuffer();
for (const [buf, name] of [[posBuf, "a_pos"], [uvBuf, "a_uv"]]) {
  const loc = gl.getAttribLocation(prog, name);
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
}
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);

const tex = gl.createTexture();
gl.enable(gl.BLEND);
gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA); // textura pré-multiplicada

// ---------------------------------------------------------------------------
// Imagem: recorte, pés, alfa
// ---------------------------------------------------------------------------

let sprite = null; // { canvas, w, h, alpha, pivot: {x, y} } em px da textura

function analyze(source) {
  const sw = source.naturalWidth || source.width, sh = source.naturalHeight || source.height;
  const k = Math.min(1, MAX_TEX / Math.max(sw, sh));
  const W = Math.max(1, Math.round(sw * k)), H = Math.max(1, Math.round(sh * k));
  const full = document.createElement("canvas");
  full.width = W; full.height = H;
  const fctx = full.getContext("2d", { willReadFrequently: true });
  fctx.imageSmoothingQuality = "high";
  fctx.drawImage(source, 0, 0, W, H);
  const data = fctx.getImageData(0, 0, W, H).data;

  // Bounding box do que é opaco: o pet ocupa a imagem inteira, sem margem morta.
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++)
    for (let x = 0; x < W; x++)
      if (data[(y * W + x) * 4 + 3] > ALPHA_MIN) {
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
  if (x1 < 0) { x0 = 0; y0 = 0; x1 = W - 1; y1 = H - 1; }

  // 2px de margem transparente: a borda da malha amostra transparente, sem serrilhado.
  const pad = 2;
  const cx0 = Math.max(0, x0 - pad), cy0 = Math.max(0, y0 - pad);
  const cw = Math.min(W, x1 + pad + 1) - cx0, ch = Math.min(H, y1 + pad + 1) - cy0;
  const canvas = document.createElement("canvas");
  canvas.width = cw; canvas.height = ch;
  canvas.getContext("2d").drawImage(full, cx0, cy0, cw, ch, 0, 0, cw, ch);

  const alpha = new Uint8Array(cw * ch);
  for (let y = 0; y < ch; y++)
    for (let x = 0; x < cw; x++) alpha[y * cw + x] = data[((y + cy0) * W + (x + cx0)) * 4 + 3];

  // Pés: centroide do alfa nos 8% de baixo do bbox. É o pivô do squash e do
  // balanço, e a âncora quando o pet está no chão (semente da Fase 3).
  const band = Math.max(1, Math.round((y1 - y0 + 1) * 0.08));
  let sx = 0, sa = 0;
  for (let y = y1 - band + 1; y <= y1; y++)
    for (let x = x0; x <= x1; x++) {
      const a = data[(y * W + x) * 4 + 3];
      if (a > ALPHA_MIN) { sx += x * a; sa += a; }
    }
  const feetX = (sa ? sx / sa : (x0 + x1) / 2) - cx0;
  return { canvas, w: cw, h: ch, alpha, pivot: { x: feetX, y: y1 + 1 - cy0 } };
}

function setSprite(source) {
  sprite = analyze(source);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, sprite.canvas);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  buildMesh();
}

function loadFile(file) {
  if (!file || !file.type.startsWith("image/")) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => { setSprite(img); URL.revokeObjectURL(url); };
  img.onerror = () => URL.revokeObjectURL(url);
  img.src = url;
}

// Mascote padrão, desenhado aqui mesmo: o penacho e a cauda são partes finas,
// boas para ver se a gelatina convence.
function drawBird() {
  const c = document.createElement("canvas");
  c.width = 360; c.height = 400;
  const g = c.getContext("2d");
  const blue = "#4f7cff", dark = "#3557c9", belly = "#f4ead8", orange = "#ff9a3c";
  g.lineCap = "round"; g.lineJoin = "round";

  g.strokeStyle = orange; g.lineWidth = 9;
  for (const x of [150, 208]) {
    g.beginPath();
    g.moveTo(x, 318); g.lineTo(x, 376);
    g.moveTo(x - 17, 388); g.lineTo(x, 376); g.lineTo(x + 19, 388);
    g.moveTo(x, 376); g.lineTo(x + 1, 390);
    g.stroke();
  }

  const feather = (x0, y0, x1, y1, w) => {
    g.save();
    g.translate(x0, y0);
    g.rotate(Math.atan2(y1 - y0, x1 - x0));
    const len = Math.hypot(x1 - x0, y1 - y0);
    g.beginPath();
    g.moveTo(0, -w);
    g.quadraticCurveTo(len * 0.6, -w * 0.8, len, 0);
    g.quadraticCurveTo(len * 0.6, w * 0.8, 0, w);
    g.fill();
    g.restore();
  };
  g.fillStyle = dark;
  feather(80, 250, 14, 312, 22);
  feather(80, 262, 30, 330, 16);
  g.fillStyle = blue;
  feather(168, 112, 132, 30, 13);
  feather(176, 110, 182, 14, 13);
  feather(184, 112, 228, 34, 11);

  g.beginPath(); g.ellipse(180, 215, 128, 120, 0, 0, TAU); g.fill();
  g.fillStyle = belly;
  g.beginPath(); g.ellipse(200, 254, 82, 72, -0.2, 0, TAU); g.fill();
  g.fillStyle = dark;
  g.beginPath(); g.ellipse(104, 236, 48, 72, 0.35, 0, TAU); g.fill();
  g.fillStyle = "#fff";
  g.beginPath(); g.arc(226, 176, 26, 0, TAU); g.fill();
  g.fillStyle = "#1a1c24";
  g.beginPath(); g.arc(233, 179, 13, 0, TAU); g.fill();
  g.fillStyle = "#fff";
  g.beginPath(); g.arc(238, 173, 4.5, 0, TAU); g.fill();
  g.fillStyle = orange;
  g.beginPath(); g.moveTo(290, 190); g.lineTo(346, 212); g.lineTo(288, 234); g.closePath(); g.fill();
  g.fillStyle = "rgba(255, 120, 140, .45)";
  g.beginPath(); g.ellipse(262, 224, 18, 11, 0, 0, TAU); g.fill();
  return c;
}

// ---------------------------------------------------------------------------
// Malha
// ---------------------------------------------------------------------------

let ds = 1;                 // px da textura -> px da tela
let cols = 1, rows = 1, count = 0, idxCount = 0;
let rest, hN, weight, L, V, out;
let bodyH = 1, bodyL = 0, bodyR = 0, bodyTop = 0;

function buildMesh() {
  const s = sprite;
  ds = P.scale / s.h;
  const cell = Math.max(s.w, s.h) / P.grid;
  cols = Math.max(1, Math.round(s.w / cell));
  rows = Math.max(1, Math.round(s.h / cell));
  count = (cols + 1) * (rows + 1);

  rest = new Float32Array(count * 2);  // relativo aos pés, px da tela, y para baixo
  hN = new Float32Array(count);        // altura normalizada: 0 nos pés, 1 no topo
  weight = new Float32Array(count);
  L = new Float32Array(count * 2);     // deslocamento da gelatina
  V = new Float32Array(count * 2);
  out = new Float32Array(count * 2);
  const uv = new Float32Array(count * 2);

  bodyH = s.pivot.y * ds;
  bodyL = -s.pivot.x * ds;
  bodyR = (s.w - s.pivot.x) * ds;
  bodyTop = -bodyH;

  for (let j = 0, i = 0; j <= rows; j++)
    for (let c = 0; c <= cols; c++, i++) {
      const u = c / cols, v = j / rows;
      uv[2 * i] = u; uv[2 * i + 1] = v;
      rest[2 * i] = (u * s.w - s.pivot.x) * ds;
      rest[2 * i + 1] = (v * s.h - s.pivot.y) * ds;
      hN[i] = clamp(-rest[2 * i + 1] / bodyH, 0, 1);
    }

  const idx = new Uint16Array(cols * rows * 6);
  let k = 0;
  for (let j = 0; j < rows; j++)
    for (let c = 0; c < cols; c++) {
      const a = j * (cols + 1) + c, b = a + 1, d = a + cols + 1, e = d + 1;
      idx[k++] = a; idx[k++] = d; idx[k++] = b;
      idx[k++] = b; idx[k++] = d; idx[k++] = e;
    }
  idxCount = k;

  gl.bindBuffer(gl.ARRAY_BUFFER, uvBuf);
  gl.bufferData(gl.ARRAY_BUFFER, uv, gl.STATIC_DRAW);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
  if (body.mode === "ground") body.y = floorY;
}

// ---------------------------------------------------------------------------
// Física
// ---------------------------------------------------------------------------

const body = { x: 0, y: 0, vx: 0, vy: 0, mode: "ground" }; // x,y = posição dos pés na tela
const sq = { s: 0, v: 0 };  // s > 0 achata, s < 0 estica
const drag = { active: false, px: 0, py: 0, gx: 0, gy: 0, downX: 0, downY: 0, downT: 0, moved: false, prevMode: "ground" };
let anchorX = 0, anchorY = 0;
let hopTimer = 0, simT = 0, paused = false;
let viewW = 0, viewH = 0, dpr = 1, worldRight = 0, floorY = 0;

function collide() {
  const left = body.x + bodyL, right = body.x + bodyR, top = body.y + bodyTop;
  if (left < 0) { body.x -= left; body.vx = Math.abs(body.vx) * WALL_BOUNCE; }
  if (right > worldRight) { body.x -= right - worldRight; body.vx = -Math.abs(body.vx) * WALL_BOUNCE; }
  if (top < 0 && body.vy < 0) { body.y -= top; body.vy = -body.vy * WALL_BOUNCE; }
  if (body.y >= floorY) {
    body.y = floorY;
    if (body.vy > 0) {
      sq.v += body.vy * SQUASH_K * P.squashGain;
      body.vy = -body.vy * P.bounce;
      if (-body.vy < 140) { body.vy = 0; body.mode = "ground"; }
    }
  }
}

function step(dt) {
  simT += dt;
  const pvx = body.vx, pvy = body.vy;
  const freeFall = !drag.active && body.mode === "air";

  if (drag.active) {
    // Ponteiro chega em eventos irregulares: a velocidade é suavizada para a
    // inércia não tremer a cada frame sem evento.
    const nx = drag.px - drag.gx, ny = Math.min(drag.py - drag.gy, floorY);
    const k = 1 - Math.exp(-dt * 30);
    body.vx += ((nx - body.x) / dt - body.vx) * k;
    body.vy += ((ny - body.y) / dt - body.vy) * k;
    body.x = nx; body.y = ny;
  } else if (body.mode === "air") {
    body.vy += P.gravity * dt;
    body.x += body.vx * dt;
    body.y += body.vy * dt;
    collide();
  } else {
    if (hopTimer > 0 && (hopTimer -= dt) <= 0) { body.vy = -HOP_V; body.mode = "air"; }
    body.vx *= Math.exp(-dt * 10);
    body.x += body.vx * dt;
    if (body.mode === "ground") body.y = floorY;
    collide();
  }

  // Aceleração "sentida" pelo corpo: em queda livre tudo cai junto, então a
  // gravidade não deforma; o que deforma é o chão, a mão ou a parede.
  const ax = (body.vx - pvx) / dt;
  const ay = (body.vy - pvy) / dt - (freeFall ? P.gravity : 0);

  // Âncora: o ponto que não balança. Trocá-la de repente não dá salto visual,
  // porque ela só muda a força e a rigidez, não o deslocamento acumulado.
  if (drag.active) { anchorX = drag.gx; anchorY = drag.gy; }
  else if (body.mode === "air") { anchorX = 0; anchorY = -bodyH * 0.5; }
  else { anchorX = 0; anchorY = 0; }

  const w0 = TAU * P.jellyHz, z = P.jellyDamp, gain = P.jellyGain * JELLY_K;
  const hang = drag.active ? P.gravity * P.hangWeight : 0;
  const R = Math.max(bodyH, bodyR - bodyL);
  for (let i = 0; i < count; i++) {
    const j = 2 * i;
    const m = Math.pow(Math.min(1, Math.hypot(rest[j] - anchorX, rest[j + 1] - anchorY) / R), P.jellyFalloff);
    weight[i] = m;
    const w = w0 * (1 - P.jellySpread * m); // pontas mais moles atrasam mais: vira onda
    const kk = w * w, c = 2 * z * w;
    V[j]     += (-kk * L[j]     - c * V[j]     - ax * gain * m) * dt;
    V[j + 1] += (-kk * L[j + 1] - c * V[j + 1] + (hang - ay * gain) * m) * dt;
    L[j] += V[j] * dt;
    L[j + 1] += V[j + 1] * dt;
  }

  const target = freeFall ? -Math.min(Math.abs(body.vy) * 0.00012 * P.stretchGain, 0.35) : 0;
  const ws = TAU * P.squashHz;
  sq.v += (-ws * ws * (sq.s - target) - 2 * P.squashDamp * ws * sq.v) * dt;
  sq.s = clamp(sq.s + sq.v * dt, -0.45, 0.6);
}

function hop() {
  if (body.mode !== "ground" || hopTimer > 0 || drag.active) return;
  hopTimer = 0.08;               // antecipação: agacha antes de subir
  sq.v += 2.5 * P.squashGain;
}

function dropFromTop() {
  drag.active = false;
  Object.assign(body, { x: worldRight / 2, y: bodyH + 20, vx: 0, vy: 0, mode: "air" });
}

function throwPet() {
  drag.active = false;
  const dir = body.x < worldRight / 2 ? 1 : -1;
  Object.assign(body, { vx: dir * 1700, vy: -1500, mode: "air" });
  if (body.y >= floorY) body.y = floorY - 1;
}

// ---------------------------------------------------------------------------
// Deformação -> vértices
// ---------------------------------------------------------------------------

function deform() {
  const H = bodyH;
  const b = P.breathAmp * Math.sin(TAU * P.breathHz * simT);
  const sy = 1 - sq.s;
  const sx = 1 + (1 / sy - 1) * P.volume;
  const maxL = 0.3 * Math.max(H, bodyR - bodyL);

  if (UI.mode === "mesh") {
    const swayA = P.swayAmp * H, swayW = TAU * P.swayHz * simT;
    for (let i = 0; i < count; i++) {
      const j = 2 * i, h = hN[i];
      let x = rest[j], y = rest[j + 1];
      const bump = Math.sin(Math.PI * h); // barriga mexe mais que pés e topo
      x *= 1 + b * (0.4 + 0.9 * bump);
      y *= 1 + b * 0.6;
      x += swayA * Math.sin(swayW - P.swayWave * h) * h * h;
      y *= sy;
      x *= 1 + (sx - 1) * (0.55 + 0.9 * bump);
      // Limite suave: arraste violento estica, mas nunca rasga a imagem.
      const lx = L[j], ly = L[j + 1], d = Math.hypot(lx, ly);
      const f = d > 1e-6 ? maxL * Math.tanh(d / maxL) / d : 1;
      out[j] = body.x + x + lx * f;
      out[j + 1] = body.y + y + ly * f;
    }
    return;
  }

  // Rígido: a mesma física, mas só o que uma transform afim consegue mostrar.
  // A gelatina vira a rotação em torno da âncora que melhor aproxima os
  // deslocamentos (mínimos quadrados).
  let num = 0, den = 0;
  for (let i = 0; i < count; i++) {
    const j = 2 * i, rx = rest[j] - anchorX, ry = rest[j + 1] - anchorY;
    num += rx * L[j + 1] - ry * L[j];
    den += rx * rx + ry * ry;
  }
  const tj = clamp(den ? num / den : 0, -0.7, 0.7);
  const ts = P.swayAmp * Math.sin(TAU * P.swayHz * simT);
  const kx = (1 + b * 0.5) * sx, ky = (1 + b * 0.6) * sy;
  const cs = Math.cos(ts), ss = Math.sin(ts), cj = Math.cos(tj), sj = Math.sin(tj);
  for (let i = 0; i < count; i++) {
    const j = 2 * i;
    let x = rest[j] * kx, y = rest[j + 1] * ky;
    [x, y] = [x * cs - y * ss, x * ss + y * cs];
    const rx = x - anchorX, ry = y - anchorY;
    out[j] = body.x + anchorX + rx * cj - ry * sj;
    out[j + 1] = body.y + anchorY + rx * sj + ry * cj;
  }
}

// ---------------------------------------------------------------------------
// Desenho
// ---------------------------------------------------------------------------

function drawUnder() {
  under.setTransform(dpr, 0, 0, dpr, 0, 0);
  under.clearRect(0, 0, viewW, viewH);
  under.fillStyle = "rgba(0, 0, 0, .18)";
  under.fillRect(0, floorY, worldRight, viewH - floorY);
  // Sombra: encolhe com a altura, ajuda a ler o pulo.
  const lift = clamp((floorY - body.y) / 400, 0, 1);
  const rx = (bodyR - bodyL) * 0.42 * (1 - lift * 0.6) * (1 + sq.s * 0.6);
  under.fillStyle = `rgba(0, 0, 0, ${0.28 * (1 - lift * 0.7)})`;
  under.beginPath();
  under.ellipse(body.x, floorY, Math.max(rx, 1), Math.max(rx * 0.16, 1), 0, 0, TAU);
  under.fill();
}

function drawOver() {
  over.setTransform(dpr, 0, 0, dpr, 0, 0);
  over.clearRect(0, 0, viewW, viewH);
  if (UI.wire) {
    over.strokeStyle = "rgba(120, 255, 230, .55)";
    over.lineWidth = 1;
    over.beginPath();
    for (let j = 0; j <= rows; j++)
      for (let c = 0; c <= cols; c++) {
        const i = 2 * (j * (cols + 1) + c);
        c ? over.lineTo(out[i], out[i + 1]) : over.moveTo(out[i], out[i + 1]);
      }
    for (let c = 0; c <= cols; c++)
      for (let j = 0; j <= rows; j++) {
        const i = 2 * (j * (cols + 1) + c);
        j ? over.lineTo(out[i], out[i + 1]) : over.moveTo(out[i], out[i + 1]);
      }
    over.stroke();
  }
  if (UI.marks) {
    const dot = (x, y, color, label) => {
      over.fillStyle = color;
      over.beginPath(); over.arc(x, y, 5, 0, TAU); over.fill();
      over.font = "11px system-ui"; over.fillText(label, x + 8, y + 4);
    };
    dot(body.x, body.y, "#ff5c7a", "pés (pivô)");
    dot(body.x + anchorX, body.y + anchorY, "#ffd34d", "âncora");
  }
}

function render() {
  deform();
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
  gl.bufferData(gl.ARRAY_BUFFER, out, gl.DYNAMIC_DRAW);
  gl.uniform2f(uRes, viewW, viewH);
  gl.drawElements(gl.TRIANGLES, idxCount, gl.UNSIGNED_SHORT, 0);
  drawUnder();
  drawOver();
}

// ---------------------------------------------------------------------------
// Laço
// ---------------------------------------------------------------------------

let last = performance.now(), acc = 0;
let frames = 0, fpsT = last, fps = 0, workMs = 0;

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  const t0 = performance.now();
  if (!paused) {
    acc += dt;
    while (acc >= STEP) { step(STEP); acc -= STEP; }
  }
  render();
  workMs = workMs * 0.9 + (performance.now() - t0) * 0.1;

  frames++;
  if (now - fpsT > 500) {
    fps = Math.round(frames * 1000 / (now - fpsT));
    frames = 0; fpsT = now;
    const state = drag.active ? "segurado" : body.mode === "air" ? "no ar" : "no chão";
    $("stats").textContent =
      `${fps} fps · ${count} vértices · ${idxCount / 3} triângulos\n` +
      `física + malha + desenho: ${workMs.toFixed(2)} ms/frame\n` +
      `imagem ${sprite.w}×${sprite.h} · ${state}`;
  }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------------------
// Entrada
// ---------------------------------------------------------------------------

// Hit-test pelo alfa, na pose de repouso (a deformação é pequena perto do ponteiro).
function restPointAt(wx, wy) {
  const s = sprite;
  const ix = (wx - body.x) / ds + s.pivot.x, iy = (wy - body.y) / ds + s.pivot.y;
  const xi = Math.floor(ix), yi = Math.floor(iy);
  if (xi < 0 || yi < 0 || xi >= s.w || yi >= s.h) return null;
  if (s.alpha[yi * s.w + xi] < ALPHA_MIN) return null;
  return { x: wx - body.x, y: wy - body.y };
}

glCanvas.addEventListener("pointerdown", (e) => {
  const p = restPointAt(e.clientX, e.clientY);
  if (!p) return;
  glCanvas.setPointerCapture(e.pointerId);
  Object.assign(drag, {
    active: true, px: e.clientX, py: e.clientY, gx: p.x, gy: p.y,
    downX: e.clientX, downY: e.clientY, downT: performance.now(), moved: false,
    prevMode: body.mode,
  });
  hopTimer = 0;
  glCanvas.style.cursor = "grabbing";
});

glCanvas.addEventListener("pointermove", (e) => {
  if (drag.active) {
    drag.px = e.clientX; drag.py = e.clientY;
    if (Math.hypot(e.clientX - drag.downX, e.clientY - drag.downY) > 4) drag.moved = true;
    return;
  }
  glCanvas.style.cursor = restPointAt(e.clientX, e.clientY) ? "grab" : "default";
});

function endDrag() {
  if (!drag.active) return;
  drag.active = false;
  glCanvas.style.cursor = "grab";
  const click = !drag.moved && performance.now() - drag.downT < 300;
  if (click && drag.prevMode === "ground") {
    body.mode = "ground"; body.vx = body.vy = 0; body.y = floorY;
    hop();
    return;
  }
  const v = Math.hypot(body.vx, body.vy), max = 4000;
  if (v > max) { body.vx *= max / v; body.vy *= max / v; }
  body.mode = "air";
}
glCanvas.addEventListener("pointerup", endDrag);
glCanvas.addEventListener("pointercancel", endDrag);

addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("dropping"); });
addEventListener("dragleave", (e) => { if (!e.relatedTarget) document.body.classList.remove("dropping"); });
addEventListener("drop", (e) => {
  e.preventDefault();
  document.body.classList.remove("dropping");
  loadFile(e.dataTransfer.files[0]);
});
addEventListener("paste", (e) => {
  for (const item of e.clipboardData.items) if (item.type.startsWith("image/")) return loadFile(item.getAsFile());
});

addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === " ") { e.preventDefault(); hop(); }
  else if (k === "m") setMode(UI.mode === "mesh" ? "rigid" : "mesh");
  else if (k === "w") { UI.wire = !UI.wire; syncUI(); save(); }
  else if (k === "p") { paused = !paused; syncUI(); }
  else if (k === "h") { UI.panel = !UI.panel; syncUI(); save(); }
});

// ---------------------------------------------------------------------------
// Painel
// ---------------------------------------------------------------------------

const inputs = {};
const decimals = (step) => (String(step).split(".")[1] || "").length;

for (const p of PARAMS) {
  const host = $("controls");
  if (p.group) {
    const h = document.createElement("h3");
    h.textContent = p.group;
    host.append(h);
    continue;
  }
  const row = document.createElement("label");
  row.className = "row";
  const span = document.createElement("span");
  span.textContent = p.label;
  const outEl = document.createElement("output");
  const input = document.createElement("input");
  Object.assign(input, { type: "range", min: p.min, max: p.max, step: p.step });
  row.append(span, outEl, input);
  host.append(row);
  const show = () => { input.value = P[p.id]; outEl.textContent = (+P[p.id]).toFixed(decimals(p.step)); };
  input.addEventListener("input", () => {
    P[p.id] = +input.value;
    outEl.textContent = P[p.id].toFixed(decimals(p.step));
    save();
    if (p.rebuild && sprite) buildMesh();
  });
  inputs[p.id] = show;
}

function setMode(mode) { UI.mode = mode; syncUI(); save(); }

function syncUI() {
  for (const id in inputs) inputs[id]();
  for (const b of $("mode").children) b.classList.toggle("on", b.dataset.v === UI.mode);
  $("wire").checked = UI.wire;
  $("marks").checked = UI.marks;
  $("pause").checked = paused;
  $("bg").value = UI.bg;
  document.body.className = UI.bg;
  $("panel").classList.toggle("hidden", !UI.panel);
  updateBounds();
}

$("mode").addEventListener("click", (e) => { if (e.target.dataset.v) setMode(e.target.dataset.v); });
$("wire").addEventListener("change", (e) => { UI.wire = e.target.checked; save(); });
$("marks").addEventListener("change", (e) => { UI.marks = e.target.checked; save(); });
$("pause").addEventListener("change", (e) => { paused = e.target.checked; });
$("bg").addEventListener("change", (e) => { UI.bg = e.target.value; syncUI(); save(); });
$("hide").addEventListener("click", () => { UI.panel = false; syncUI(); save(); });
$("show").addEventListener("click", () => { UI.panel = true; syncUI(); save(); });
$("file").addEventListener("change", (e) => { loadFile(e.target.files[0]); e.target.value = ""; });
$("bird").addEventListener("click", () => setSprite(drawBird()));
$("hop").addEventListener("click", hop);
$("drop").addEventListener("click", dropFromTop);
$("throw").addEventListener("click", throwPet);
$("reset").addEventListener("click", () => {
  Object.assign(P, DEFAULTS);
  syncUI(); save();
  if (sprite) buildMesh();
});
$("copy").addEventListener("click", async (e) => {
  const json = JSON.stringify(P, null, 2);
  console.log(json);
  try { await navigator.clipboard.writeText(json); e.target.textContent = "Copiado!"; }
  catch { e.target.textContent = "Veja o console"; }
  setTimeout(() => (e.target.textContent = "Copiar parâmetros"), 1500);
});

// ---------------------------------------------------------------------------
// Tamanho da tela
// ---------------------------------------------------------------------------

function updateBounds() {
  worldRight = viewW - (UI.panel ? $("panel").offsetWidth : 0);
  floorY = viewH - FLOOR_MARGIN;
  if (body.mode === "ground" && !drag.active) body.y = floorY;
  if (sprite) collide();
}

function resize() {
  dpr = devicePixelRatio || 1;
  viewW = innerWidth; viewH = innerHeight;
  for (const c of [glCanvas, under.canvas, over.canvas]) {
    c.width = Math.round(viewW * dpr);
    c.height = Math.round(viewH * dpr);
  }
  gl.viewport(0, 0, glCanvas.width, glCanvas.height);
  updateBounds();
}
addEventListener("resize", resize);

resize();
syncUI();
setSprite(drawBird());
body.x = worldRight / 2;
body.y = floorY;
requestAnimationFrame(frame);
</script>
</body>
</html>
