<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src pet:" />
<title>Perch · editar pet</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; grid-template-rows: auto auto 1fr auto; font: 13px/1.4 system-ui, sans-serif;
    color: #e8eaf0; background: #14161f; user-select: none;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
    padding: 10px 16px; border-bottom: 1px solid #262a38;
  }
  header h1 { font-size: 15px; margin: 0 6px 0 0; }
  header label { display: flex; align-items: center; gap: 8px; }
  header input[type=range] { width: 180px; }
  .spacer { flex: 1; }
  #status { color: #a3a8b8; min-width: 150px; text-align: right; }
  #status.dirty { color: #ffcf6e; }
  #status.error { color: #ff7a8a; }
  button, select, input[type=text] {
    font: inherit; color: #e8eaf0; background: #2a2f40; border: 1px solid #3c4359;
    border-radius: 6px; padding: 6px 12px;
  }
  button { cursor: pointer; }
  button:hover { background: #343a50; }
  button.primary { background: #4b63c9; border-color: #6f8dff; }
  button.primary:hover { background: #5671dd; }
  button:disabled { opacity: .45; cursor: default; }
  select { padding: 5px 8px; }
  input[type=text] { width: 160px; }
  input[type=range] { accent-color: #6f8dff; }
  output { font-variant-numeric: tabular-nums; color: #cfd3df; min-width: 48px; display: inline-block; }
  #newPetForm { display: none; gap: 6px; }
  #newPetForm.open { display: flex; }

  main { display: grid; grid-template-rows: minmax(240px, 1fr) auto; min-height: 0; }
  #stage { width: 100%; height: 100%; display: block; cursor: default; }
  #stage.over { cursor: ns-resize; }
  #hint { padding: 6px 16px; color: #8a90a3; border-top: 1px solid #262a38; }

  #cards {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px;
    padding: 10px 16px 14px; max-height: 280px; overflow-y: auto; border-top: 1px solid #262a38;
  }
  .card { padding: 8px 10px; border: 1px solid #2c3142; border-radius: 8px; background: #1a1d29; cursor: pointer; }
  .card.sel { border-color: #6f8dff; background: #1e2335; }
  .card .top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .card .name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .auto { font-size: 11px; color: #8fa8ff; }
  .card .row { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 6px; margin: 2px 0; }
  .card .row input, .card .row select { width: 100%; }
  .card .row.state { grid-template-columns: 52px 1fr; }
  .card button { padding: 2px 8px; font-size: 12px; }
  .card button.del:hover { background: #6a2a35; border-color: #a04452; }
  .empty { padding: 30px; text-align: center; color: #a3a8b8; grid-column: 1 / -1; }

  body.dropping::after {
    content: "Solte as imagens para adicionar ao pet"; position: fixed; inset: 12px;
    border: 3px dashed #6f8dff; border-radius: 16px; display: grid; place-items: center;
    font-size: 22px; background: #14161fcc; pointer-events: none;
  }

  /* Tela de importação de uma imagem */
  #import { position: fixed; inset: 0; display: none; place-items: center; background: #0009; z-index: 5; }
  #import.open { display: grid; }
  .modal {
    width: min(900px, 94vw); max-height: 92vh; overflow: auto; padding: 16px 18px;
    background: #1a1d29; border: 1px solid #343a50; border-radius: 12px;
  }
  .modal h2 { font-size: 15px; margin: 0 0 12px; }
  .modal h2 span { color: #a3a8b8; font-weight: 400; }
  .impBody { display: grid; grid-template-columns: 1fr 280px; gap: 16px; }
  #impPreview {
    width: 100%; height: 420px; display: block; border-radius: 8px; cursor: crosshair;
    background: repeating-conic-gradient(#2a2e3c 0 25%, #22252f 0 50%) 0 0 / 20px 20px;
  }
  #impPreview.light { background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 20px 20px; }
  .impControls { display: flex; flex-direction: column; gap: 10px; }
  .impControls label { display: flex; align-items: center; gap: 8px; }
  .impControls label.col { flex-direction: column; align-items: stretch; gap: 4px; }
  .impControls .rangeRow { display: flex; gap: 8px; align-items: center; }
  .impControls .rangeRow input { flex: 1; }
  #impName { font-weight: 600; word-break: break-all; }
  #impInfo { color: #a3a8b8; margin: 0; min-height: 3em; }
  .modal .buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: auto; }
</style>
</head>
<body>
  <header>
    <h1>Editar pet</h1>
    <label>Pet <select id="petSelect"></select></label>
    <button id="newPet">Novo pet</button>
    <span id="newPetForm"><input type="text" id="newPetName" placeholder="Nome do pet" maxlength="40"><button id="newPetOk" class="primary">Criar</button><button id="newPetCancel">Cancelar</button></span>
    <span class="spacer"></span>
    <button id="addImages" class="primary">Adicionar imagens</button>
    <input type="file" id="fileInput" accept="image/*" multiple hidden>
    <button id="importZip" title="Abrir um pet compartilhado (.zip)">Importar .zip</button>
    <button id="exportZip" title="Salvar este pet num .zip para compartilhar">Exportar .zip</button>
  </header>
  <header>
    <label>Altura do personagem
      <input type="range" id="height" min="50" max="320" step="1" />
      <output id="heightOut"></output>
    </label>
    <button id="autoAll" title="Descarta os ajustes e volta ao palpite automático">Tudo automático</button>
    <span class="spacer"></span>
    <span id="status"></span>
    <button id="discard">Descartar</button>
    <button id="save" class="primary">Salvar</button>
  </header>
  <main>
    <canvas id="stage"></canvas>
    <div id="cards"></div>
  </main>
  <div id="hint">
    Deixe todos os personagens com o mesmo tamanho (a linha tracejada é a altura alvo).
    Na imagem: roda do mouse = tamanho · arrastar para cima/baixo = chão · duplo clique = automático.
    Teclado: ↑ ↓ chão · + − tamanho. <span id="win"></span>
  </div>

  <div id="import">
    <div class="modal">
      <h2>Adicionar imagem <span id="impCount"></span></h2>
      <div class="impBody">
        <canvas id="impPreview" title="Clique numa área do fundo para escolher a cor que será removida"></canvas>
        <div class="impControls">
          <div id="impName"></div>
          <label class="col">Estado <select id="impState"></select></label>
          <label><input type="checkbox" id="impBg"> Remover fundo</label>
          <label class="col">Tolerância
            <span class="rangeRow"><input type="range" id="impTol" min="0" max="150" step="1" value="40"><output id="impTolOut"></output></span>
          </label>
          <label><input type="checkbox" id="impHoles"> Remover também buracos fechados</label>
          <label><input type="checkbox" id="impSoft" checked> Borda suave</label>
          <label><input type="checkbox" id="impLight"> Prévia em fundo claro</label>
          <p id="impInfo"></p>
          <div class="buttons">
            <button id="impCancel">Cancelar</button>
            <button id="impSkip">Pular</button>
            <button id="impAdd" class="primary">Adicionar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="mesh.js"></script>
  <script src="bgremove.js"></script>
  <script src="calibrate.js"></script>
  <script src="editor.js"></script>
</body>
</html>
