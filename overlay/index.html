<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src pet:; connect-src http://127.0.0.1:4747" />
<title>Perch</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
  }

  /* O movimento inteiro (respiração, pulo, balanço, gelatina) é do mesh.js.
     Aqui ficam só opacidade, brilho e cursor de cada estado. */
  #pet {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 320ms ease;
  }
  #pet.interactive { cursor: grab; }
  #pet.dragging    { cursor: grabbing; }

  /* idle: invisível. Nada acontecendo = nada na tela. Com o "modo pet"
     (body.petmode, padrão) ele fica e vive a vida dele (brain.js). */
  #pet.idle    { opacity: 0; }
  body.petmode #pet.idle { opacity: 1; }
  #pet.working { opacity: .85; }
  #pet.done    { opacity: 1; }
  #pet.blocked {
    opacity: 1;
    filter: drop-shadow(0 0 10px rgba(217,119,87,.95));
  }
  /* Reação de outra fonte (hooks/perch.js): aparece mesmo no ócio sem modo pet. */
  #pet.react { opacity: 1; }
  #pet.react-alert { filter: drop-shadow(0 0 10px rgba(217,119,87,.95)); }
</style>
</head>
<body>
  <canvas id="pet" class="idle"></canvas>
  <script src="mesh.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
